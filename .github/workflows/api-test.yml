name: API Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          TEST_NICKNAME: ${{ secrets.TEST_NICKNAME }}
        run: pytest -v