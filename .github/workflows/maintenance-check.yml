name: Maintenance Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 3-14 * * 4"
      timezone: "Asia/Seoul"

concurrency:
  group: api-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 점검 응답 확인
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          TEST_NICKNAME: ${{ secrets.TEST_NICKNAME }}
        run: python scripts/maintenance_check.py
